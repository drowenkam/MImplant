<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MImpDent portal · File health check</title><link rel="stylesheet" href="site.css"></head><body><header class="site-header"><div class="container header-in"><a class="brand" href="index.html#home"><span class="brand-emblem">M+</span><span><strong>M IMP DENT</strong><small>WEBSITE HEALTH CHECK</small></span></a></div></header><main class="container content"><h1>Website installation check</h1><p>Tests the files needed by the offline study portal. Open this page online after publishing to GitHub Pages.</p><p id="status">Running checks…</p><div id="checks" class="card"></div><p><a href="index.html#home" class="btn primary">Back to study portal</a></p></main><script>
(async()=>{const paths=['index.html','site.css','styles.css','portal.js','quiz-app.js','data/questions.js','data/revision.js','data/cases.js','assets/page-00.js','assets/page-06.js','pdf/01_Revision_Guide.pdf','pdf/02_SBA_800_Questions.pdf','pdf/03_SBA_800_Answers_Explanations.pdf','pdf/04_OSCE_58_Stations.pdf','pdf/05_SOE_51_Cases.pdf','sw.js'];let good=0;const d=document.getElementById('checks');for(const p of paths){const line=document.createElement('div');try{const r=await fetch(p,{method:'HEAD',cache:'no-store'});line.textContent=(r.ok?'✓ ':'✕ ')+p+' · HTTP '+r.status;if(r.ok)good++}catch(e){line.textContent='✕ '+p+' · '+e.message}d.append(line)}document.getElementById('status').textContent=`${good} of ${paths.length} required files accessible online.`})();
</script></body></html>
